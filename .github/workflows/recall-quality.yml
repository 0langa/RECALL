name: RECALL Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install ruff mypy

      - name: Ruff (blocking)
        run: python -m ruff check .

      - name: Mypy (blocking, lenient baseline)
        run: python -m mypy --config-file pyproject.toml

  bench-light:
    # Non-blocking token/quality benchmark: uploads the report, never fails
    # the build (flip to --strict once baselines prove stable).
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bench harness self-tests
        run: python -m pytest bench/tests -q

      - name: Light benchmark vs baseline (non-blocking)
        run: python bench/run_bench.py run --mode light --baseline bench/baselines/v1.3.0.json --out bench/runs/ci-light

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-light-report
          path: bench/runs/ci-light/report.*

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run complete unit suite
        working-directory: plugins/recall
        run: python scripts/run_tests.py --exclude-smoke --json

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke harness
        working-directory: plugins/recall
        run: python scripts/smoke_recall.py --json

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RECALL quality suite
        run: python RECALL_quality_suite/scripts/run_recall_quality_suite.py --repo-root . --quick --skip-existing-unit

  package:
    needs: [unit, smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package after unit and smoke gates
        run: python build_plugin.py --skip-validator --skip-tests --skip-smoke
