name: RECALL Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install ruff==0.15.20 mypy==2.1.0

      - name: Ruff (blocking)
        run: python -m ruff check .

      - name: Mypy (blocking, lenient baseline)
        run: python -m mypy --config-file pyproject.toml

  bench-light:
    # Blocking token/quality benchmark since 2026-07-06: flipped to --strict
    # after 2 consecutive Linux CI runs (+ local Windows) produced the exact
    # same emission_hash against bench/baselines/v1.3.0.json. Before that
    # date this job silently never ran past its first step (missing pytest
    # install, masked by continue-on-error) for the harness's entire history.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench test tooling
        run: python -m pip install pytest==9.1.1

      - name: Bench harness self-tests
        run: python -m pytest bench/tests -q

      - name: Light benchmark vs baseline (strict)
        run: python bench/run_bench.py run --mode light --baseline bench/baselines/v1.3.0.json --out bench/runs/ci-light --strict

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-light-report
          path: bench/runs/ci-light/report.*

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run complete unit suite
        working-directory: plugins/recall
        run: python scripts/run_tests.py --exclude-smoke --json

  coverage:
    # Visibility only (not a gate) — no coverage threshold enforced yet.
    # Uses pytest to collect the same unittest-style suite as a single
    # process so `coverage` can instrument it; the `unit` job above (parallel,
    # per-file subprocess isolation via scripts/run_tests.py) stays the real
    # correctness gate.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tooling
        run: python -m pip install pytest==9.1.1 coverage==7.15.0

      - name: Coverage over the unit suite
        run: |
          python -m coverage run -m pytest plugins/recall/tests -q
          python -m coverage report --include="plugins/recall/scripts/*,plugins/recall/hooks/scripts/*"

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke harness
        working-directory: plugins/recall
        run: python scripts/smoke_recall.py --json

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RECALL quality suite
        run: python RECALL_quality_suite/scripts/run_recall_quality_suite.py --repo-root . --quick --skip-existing-unit

  package:
    needs: [unit, smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package after unit and smoke gates
        run: python build_plugin.py --skip-validator --skip-tests --skip-smoke
