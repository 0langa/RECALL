name: RECALL Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run plugin tests
        working-directory: plugins/recall
        run: python -m unittest discover -s tests

      - name: Run RECALL quality suite
        run: python RECALL_quality_suite/scripts/run_recall_quality_suite.py --repo-root . --quick
